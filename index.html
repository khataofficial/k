<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Story QA</title>
</head>
<body>
  <h2>Story parho, sawal pucho</h2>
  <textarea id="story" rows="8" cols="60">Ahmed was a young boy who lived in Karachi. He loved playing cricket with his friend Bilal.</textarea><br>
  <input id="question" size="50" placeholder="Sawal likho...">
  <button id="btn" disabled>Loading model...</button>
  <p id="answer"></p>

  <script type="module">
  import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0";

  const gen = await pipeline("text2text-generation", "Xenova/flan-t5-base");

  const btn = document.getElementById("btn");
  btn.disabled = false;
  btn.textContent = "Jawab do";

  btn.onclick = async () => {
    const story = document.getElementById("story").value;
    const q = document.getElementById("question").value;

    const prompt = `Read the story and answer the question in 5 to 6 full sentences.
Story: ${story}
Question: ${q}
Answer:`;

    const out = await gen(prompt, {
      max_new_tokens: 150,
      min_new_tokens: 60,
      num_beams: 4,
      no_repeat_ngram_size: 3
    });
    document.getElementById("answer").textContent = out[0].generated_text;
  };
</script>
</body>
</html>
